<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sip - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-auth-compat.js"></script>
    <style>
        :root {
            --primary-brown: #3E2723;
            --secondary-brown: #5D4037;
            --gold: #D4AF37;
            --light-gold: #F9E79F;
            --bg-dark: #1a1410;
            --text-light: #F5F5F5;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        
        /* Header & Premium Logo */
        header { background: linear-gradient(to bottom, var(--primary-brown), #2e1c18); border-bottom: 3px solid var(--gold); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 56px; font-weight: 800; font-style: italic;
            cursor: pointer; user-select: none; transition: transform 0.3s;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: inline-block; text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }
        .logo:active { transform: scale(0.95); }

        /* Search & Categories */
        .search-container { padding: 15px 20px 0 20px; background-color: var(--primary-brown); position: sticky; top: 90px; z-index: 99; }
        .search-input { width: 100%; padding: 12px 20px; border-radius: 25px; background-color: var(--bg-dark); border: 1px solid var(--secondary-brown); color: var(--text-light); font-size: 16px; outline: none; transition: border-color 0.3s; }
        .search-input:focus { border-color: var(--gold); }
        .categories { display: flex; justify-content: flex-start; flex-wrap: nowrap; gap: 10px; padding: 15px 20px; background-color: var(--primary-brown); overflow-x: auto; white-space: nowrap; position: sticky; top: 153px; z-index: 98; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .categories::-webkit-scrollbar { height: 0; }
        .cat-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 15px; transition: all 0.3s ease; flex-shrink: 0; }
        .cat-btn.active { background-color: var(--gold); color: var(--primary-brown); font-weight: bold; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); }
        .cat-btn:active { transform: scale(0.93); }
        
        /* Menu Grid */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 30px; }
        .menu-item { background: linear-gradient(145deg, var(--primary-brown), #321e1a); border-radius: 15px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.5); border: 1px solid #4e302a; transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; opacity: 0; animation: fadeInUp 0.5s ease forwards; }
        .menu-item:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 12px 25px rgba(0,0,0,0.6), 0 0 15px rgba(212, 175, 55, 0.1); }
        .img-container { width: 100%; aspect-ratio: 4 / 3; background-color: #2a1a15; overflow: hidden; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .menu-item:hover .img-container img { transform: scale(1.08); }
        .item-info { padding: 15px 20px; }
        .item-name { font-size: 20px; color: var(--gold); margin: 0 0 8px 0; }
        .item-extras { font-size: 13px; color: #ccc; margin-bottom: 10px; font-style: italic; min-height: 20px;}
        .item-price { font-size: 18px; font-weight: bold; color: var(--light-gold); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Animated Decorations (Coffee & Cold Drink) */
        .deco { position: fixed; bottom: 20px; z-index: 1; pointer-events: none; font-size: 50px; opacity: 0.8; }
        .deco-hot { right: 30px; animation: bobbing 3s ease-in-out infinite; text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .deco-cold { left: 30px; animation: bobbing 3.5s ease-in-out infinite reverse; text-shadow: 0 0 15px rgba(179, 229, 252, 0.4); }
        @keyframes bobbing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .steam { position: absolute; top: -10px; left: 50%; width: 4px; height: 15px; background: rgba(255,255,255,0.4); border-radius: 10px; opacity: 0; }
        .deco-hot .steam:nth-child(1) { left: 40%; animation: steamRise 2s infinite ease-in; }
        .deco-hot .steam:nth-child(2) { left: 50%; animation: steamRise 2s infinite ease-in 0.5s; }
        .deco-hot .steam:nth-child(3) { left: 60%; animation: steamRise 2s infinite ease-in 1s; }
        @keyframes steamRise { 0% { transform: translateY(0) scale(1); opacity: 0.6; } 100% { transform: translateY(-30px) scale(2); opacity: 0; } }

        .deco-cold::before, .deco-cold::after { content: '❄'; position: absolute; top: -10px; color: #E1F5FE; font-size: 18px; animation: iceFall 2.5s infinite ease-out; opacity: 0; }
        .deco-cold::before { left: 30%; animation-delay: 0s; }
        .deco-cold::after { left: 60%; animation-delay: 1.2s; }
        @keyframes iceFall { 0% { transform: translateY(0); opacity: 0.8; } 100% { transform: translateY(40px); opacity: 0; } }

        /* Footer */
        .footer { background-color: #100d0b; border-top: 1px solid var(--secondary-brown); padding: 40px 20px; text-align: center; margin-top: 50px; position: relative; z-index: 2; }
        .footer-ad-box { max-width: 600px; margin: 0 auto 20px auto; padding: 25px; background: linear-gradient(145deg, var(--primary-brown), #321e1a); border: 1px solid var(--gold); border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .footer-ad-text { color: #ccc; font-size: 17px; margin-bottom: 20px; line-height: 1.6; font-weight: 500; }
        .whatsapp-btn { display: inline-flex; align-items: center; gap: 10px; background: #25D366; color: white; padding: 12px 35px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .whatsapp-btn:hover { transform: scale(1.05); background: #1da851; }
        .whatsapp-icon { width: 24px; height: 24px; fill: white; }
        .copyright { font-size: 12px; color: #666; margin-top: 20px; }

        /* Admin Panel */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); overflow-y: auto; padding: 20px 0; }
        .modal-content { background-color: var(--primary-brown); margin: 20px auto; padding: 25px; border: 1px solid var(--gold); border-radius: 12px; width: 90%; max-width: 800px; position: relative; }
        .close-btn { color: var(--gold); position: absolute; top: 15px; left: 20px; font-size: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: white; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--gold); padding-bottom: 10px;}
        .admin-tab { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 15px; cursor: pointer; border-radius: 5px; font-size: 14px; transition: 0.3s; }
        .admin-tab.active { background: var(--gold); color: var(--primary-brown); font-weight: bold;}
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: var(--bg-dark); border: 1px solid var(--gold); color: white; border-radius: 5px; font-size: 16px; font-family: inherit; }
        textarea { resize: vertical; min-height: 60px; }
        button.action-btn { background: var(--gold); color: var(--primary-brown); border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; }
        button.action-btn:active { transform: scale(0.98); }
        .file-upload { position: relative; display: block; width: 100%; margin: 8px 0 15px 0; }
        .file-upload-label { display: flex; align-items: center; justify-content: center; padding: 20px; border: 2px dashed var(--secondary-brown); border-radius: 8px; cursor: pointer; color: var(--gold); transition: 0.3s; background: var(--bg-dark); }
        .file-upload-label:hover { border-color: var(--gold); background: #221814; }
        .file-upload input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; top: 0; left: 0; }
        .image-preview { max-width: 100px; max-height: 100px; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid var(--gold); }
        .upload-status { font-size: 12px; color: var(--light-gold); margin-top: 5px; text-align: center; }
        .admin-item-list div, .admin-cat-list div { background: var(--bg-dark); padding: 12px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border: 1px solid #333; }
        .list-btns { display: flex; gap: 8px; }
        .edit-btn { background: #2196F3; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 3px; font-size: 14px; transition: 0.3s;}
        .edit-btn:active { transform: scale(0.95); }
        .delete-btn { background: #b71c1c; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 3px; font-size: 14px; transition: 0.3s;}
        .delete-btn:active { transform: scale(0.95); }
        
        @media (max-width: 768px) {
            .deco { display: none; } /* إخفاء الزينة على الموبايل لتبقى الواجهة نظيفة */
        }
        @media (max-width: 600px) {
            .logo { font-size: 42px; }
            .menu-grid { grid-template-columns: 1fr; padding: 15px; gap: 20px; }
            .modal-content { width: 95%; padding: 15px; margin-top: 0; }
            .item-name { font-size: 18px; }
            .categories { top: 143px; }
        }
    </style>
</head>
<body>

    </div>
    
    <div class="categories" id="categoryBar"></div>
    
    <div class="menu-grid" id="menuGrid"></div>

    <!-- الإشارات المتحركة -->
    <div class="deco deco-hot">
        <div class="steam"></div><div class="steam"></div><div class="steam"></div>
        ☕

    <!-- التذييل الإعلاني المبسط -->
    <footer class="footer">
        <div class="footer-ad-box">
            <p class="footer-ad-text">للخدمات التقنية والفنية، تواصل معنا الآن.</p>
            <a href="https://wa.me/963982398084" target="_blank" class="whatsapp-btn">
                <svg class="whatsapp-icon" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                واتساب

    <!-- Admin Modals -->
    <div class="modal" id="passwordModal">
        <div class="modal-content" style="max-width: 350px; text-align: center; margin-top: 15vh;">
            <span class="close-btn" onclick="closeModal('passwordModal')">&times;</span>
            <h2 style="color: var(--gold); margin-top: 20px;">لوحة التحكم</h2>
            <input type="password" id="passInput" placeholder="أدخل كلمة المرور" onkeydown="if(event.key==='Enter') checkPass()">
            <button class="action-btn" onclick="checkPass()">دخول</button>
        </div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
            <h2 style="color: var(--gold); margin-bottom: 20px;">إدارة المينيو</h2>
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchTab('items', event)">المشروبات</button>
                <button class="admin-tab" onclick="switchTab('categories', event)">الفئات</button>
            </div>
            <div id="itemsTab">
                <h3 style="color:var(--gold); font-size: 18px;">إضافة / تعديل مشروب</h3>
                <input type="hidden" id="itemId">
                <input type="text" id="itemName" placeholder="اسم المشروب">
                <input type="text" id="itemPrice" placeholder="السعر (مثال: 15,000 ل.س)">
                
                <input type="hidden" id="itemImage" value="">
                <div class="file-upload">
                    <label class="file-upload-label" id="fileLabel">📷 اختر صورة من الجهاز</label>
                    <input type="file" id="itemImageFile" accept="image/*">
                    <img id="imagePreview" class="image-preview" src="">
                    <div id="uploadStatus" class="upload-status"></div>
                </div>

                <textarea id="itemExtras" placeholder="الإضافات (مثال: سكر إضافي، حليب)"></textarea>
                <select id="itemCategory"></select>
                <button class="action-btn" onclick="saveItem()">حفظ المشروب</button>
                <hr style="border-color:var(--gold); margin: 20px 0;">
                <div class="admin-item-list" id="adminItemList"></div>
            </div>
            <div id="categoriesTab" style="display:none;">
                <h3 style="color:var(--gold); font-size: 18px;">إضافة فئة جديدة</h3>
                <input type="text" id="newCatName" placeholder="اسم الفئة (مثال: مشروبات باردة)">
                <button class="action-btn" onclick="addCategory()">إضافة الفئة</button>
                <hr style="border-color:var(--gold); margin: 20px 0;">
                <div class="admin-cat-list" id="adminCatList"></div>
            </div>
        </div>
    </div>

    <script>
       const firebaseConfig = {
  apiKey: "AIzaSyDd8F5oDoDVtondKCZZvLaZ3G06mCksTXw",
  authDomain: "sip-store-dcd00.firebaseapp.com",
  databaseURL: "https://sip-store-dcd00-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sip-store-dcd00",
  storageBucket: "sip-store-dcd00.firebasestorage.app",
  messagingSenderId: "414792173996",
  appId: "1:414792173996:web:160d547d13cd7a19985209"
};
// Initialize Firebase
const app = initializeApp(firebaseConfig); 

        
        const IMGBB_API_KEY = "ff8ab5606d36fe74528c851a64e38251"; 
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let data = { categories: [], items: [] };
        let currentCategory = null;
        const ADMIN_PASSWORD = "ssiipp2025"; 

        let clickCount = 0, clickTimer = null;
        function handleLogoClick() {
            clickCount++;
            if (clickCount === 1) clickTimer = setTimeout(() => clickCount = 0, 2000);
            if (clickCount === 5) {
                clearTimeout(clickTimer); clickCount = 0;
                document.getElementById('passwordModal').style.display = 'block';
            }
        }

        function checkPass() {
            if (document.getElementById('passInput').value === ADMIN_PASSWORD) {
                auth.signInAnonymously().then(() => {
                    closeModal('passwordModal');
                    document.getElementById('passInput').value = '';
                    openAdmin();
                }).catch((error) => alert("خطأ: " + error.message));
            } else { alert("كلمة المرور خاطئة!"); }
        }

        function openAdmin() { document.getElementById('adminModal').style.display = 'block'; loadAdminLists(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function switchTab(tab, e) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById('itemsTab').style.display = tab === 'items' ? 'block' : 'none';
            document.getElementById('categoriesTab').style.display = tab === 'categories' ? 'block' : 'none';
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxWidth = 800; 
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => callback(blob), 'image/jpeg', 0.7); 
                };
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('itemImageFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('uploadStatus').innerText = "⏳ جاري المعالجة والرفع...";
            document.getElementById('fileLabel').innerText = "⏳ جاري الرفع...";

            compressImage(file, (compressedBlob) => {
                const formData = new FormData();
                formData.append('image', compressedBlob);

                fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('itemImage').value = data.data.url;
                        document.getElementById('imagePreview').src = data.data.url;
                        document.getElementById('imagePreview').style.display = 'block';
                        document.getElementById('uploadStatus').innerText = "✅ تم رفع الصورة بنجاح!";
                        document.getElementById('fileLabel').innerText = "✅ اختر صورة أخرى (اختياري)";
                    } else {
                        throw new Error('Upload failed');
                    }
                })
                .catch(err => {
                    document.getElementById('uploadStatus').innerText = "❌ فشل رفع الصورة. تأكد من مفتاح API.";
                });
            });
        });

        db.ref('sipMenu').on('value', (snapshot) => {
            const dbData = snapshot.val();
            if (dbData) {
                data.categories = dbData.categories || [];
                data.items = dbData.items || [];
            } else {
                data.categories = [{ id: 1, name: "مشروبات ساخنة" }, { id: 2, name: "مشروبات باردة" }];
                data.items = [{ id: 1, name: "قهوة لاتيه", price: "15,000 ل.س", image: "https://images.unsplash.com/photo-1561882468-9110e03e0f78?auto=compress&cs=tinysrgb&w=400", extras: "سكر، حليب", categoryId: 1 }];
                db.ref('sipMenu').set(data);
            }
            renderMenu();
            if (document.getElementById('adminModal').style.display === 'block') loadAdminLists();
        });

        function renderMenu() {
            const catBar = document.getElementById('categoryBar');
            const grid = document.getElementById('menuGrid');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            catBar.innerHTML = ''; grid.innerHTML = '';

            let allBtn = document.createElement('button');
            allBtn.className = 'cat-btn' + (currentCategory === null ? ' active' : '');
            allBtn.innerText = "الكل";
            allBtn.onclick = () => { currentCategory = null; renderMenu(); };
            catBar.appendChild(allBtn);

            data.categories.forEach(cat => {
                let btn = document.createElement('button');
                btn.className = 'cat-btn' + (currentCategory === cat.id ? ' active' : '');
                btn.innerText = cat.name;
                btn.onclick = () => { currentCategory = cat.id; renderMenu(); };
                catBar.appendChild(btn);
            });

            let filteredItems = currentCategory === null ? data.items : data.items.filter(i => i.categoryId === currentCategory);
            if(searchText) {
                filteredItems = filteredItems.filter(item => item.name.toLowerCase().includes(searchText) || (item.extras && item.extras.toLowerCase().includes(searchText)));
            }

            if(filteredItems.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:var(--gold); grid-column:1/-1; margin-top:50px; font-size:18px;">لا يوجد مشروبات مطابقة</p>';
            } else {
                filteredItems.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'menu-item';
                    div.style.animationDelay = `${index * 0.05}s`; 
                    div.innerHTML = `
                        <div class="img-container">
                            <img src="${item.image || 'https://via.placeholder.com/400x300/3E2723/D4AF37?text=sip'}" alt="${item.name}">
                        </div>
                        <div class="item-info">
                            <h3 class="item-name">${item.name}</h3>
                            <p class="item-extras">${item.extras || ''}</p>
                            <p class="item-price">${item.price}</p>
                        </div>`;
                    grid.appendChild(div);
                });
            }
        }

        function loadAdminLists() {
            const catSelect = document.getElementById('itemCategory');
            catSelect.innerHTML = '';
            data.categories.forEach(c => { let opt = document.createElement('option'); opt.value = c.id; opt.innerText = c.name; catSelect.appendChild(opt); });

            const itemList = document.getElementById('adminItemList');
            itemList.innerHTML = '';
            data.items.forEach(item => {
                let catName = data.categories.find(c => c.id === item.categoryId)?.name || 'غير مصنف';
                let div = document.createElement('div');
                div.innerHTML = `<span style="flex:1; min-width:150px;"><b style="color:var(--gold)">${item.name}</b> <br><small style="color:#aaa">${catName} - ${item.price}</small></span>`;
                let btns = document.createElement('div');
                btns.className = 'list-btns';
                let editBtn = document.createElement('button'); editBtn.className='edit-btn'; editBtn.innerText='تعديل'; editBtn.onclick=()=>editItem(item.id);
                let delBtn = document.createElement('button'); delBtn.className='delete-btn'; delBtn.innerText='حذف'; delBtn.onclick=()=>deleteItem(item.id);
                btns.appendChild(editBtn); btns.appendChild(delBtn); 
                div.appendChild(btns); 
                itemList.appendChild(div);
            });

            const catList = document.getElementById('adminCatList');
            catList.innerHTML = '';
            data.categories.forEach(c => {
                let div = document.createElement('div');
                div.innerHTML = `<span><b style="color:var(--gold)">${c.name}</b></span>`;
                let delBtn = document.createElement('button'); delBtn.className='delete-btn'; delBtn.innerText='حذف'; delBtn.onclick=()=>deleteCategory(c.id);
                div.appendChild(delBtn); catList.appendChild(div);
            });
        }

        function saveData() { db.ref('sipMenu').set(data); }

        function saveItem() {
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value.trim();
            const image = document.getElementById('itemImage').value.trim(); 
            const extras = document.getElementById('itemExtras').value.trim();
            const categoryId = parseInt(document.getElementById('itemCategory').value);
            
            if(!name || !price || !categoryId) { alert("يرجى إدخال الاسم والسعر والفئة"); return; }

            if(id) { 
                let item = data.items.find(i => i.id == id); 
                item.name = name; item.price = price; item.image = image; item.extras = extras; item.categoryId = categoryId; 
            } else { 
                const newId = data.items.length > 0 ? Math.max(...data.items.map(i => i.id)) + 1 : 1; 
                data.items.push({ id: newId, name, price, image, extras, categoryId }); 
            }
            
            saveData();
            document.getElementById('itemId').value = ''; 
            document.getElementById('itemName').value = ''; 
            document.getElementById('itemPrice').value = ''; 
            document.getElementById('itemImage').value = ''; 
            document.getElementById('itemImageFile').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('uploadStatus').innerText = "";
            document.getElementById('fileLabel').innerText = "📷 اختر صورة من الجهاز";
            alert("تم الحفظ بنجاح!");
        }

        function editItem(id) {
            let item = data.items.find(i => i.id === id);
            document.getElementById('itemId').value = item.id; 
            document.getElementById('itemName').value = item.name; 
            document.getElementById('itemPrice').value = item.price; 
            
            if(item.image) {
                document.getElementById('itemImage').value = item.image;
                document.getElementById('imagePreview').src = item.image;
                document.getElementById('imagePreview').style.display = 'block';
            }
            
            document.getElementById('itemExtras').value = item.extras; 
            document.getElementById('itemCategory').value = item.categoryId;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(id) { if(confirm("هل أنت متأكد من حذف هذا المشروب؟")) { data.items = data.items.filter(i => i.id !== id); saveData(); } }
        function addCategory() { const name = document.getElementById('newCatName').value.trim(); if(!name) return; const newId = data.categories.length > 0 ? Math.max(...data.categories.map(c => c.id)) + 1 : 1; data.categories.push({ id: newId, name }); document.getElementById('newCatName').value = ''; saveData(); }
        function deleteCategory(id) { if(confirm("حذف الفئة سيؤدي إلى بقاء المشروبات بدون فئة. متابعة؟")) { data.categories = data.categories.filter(c => c.id !== id); saveData(); } }
    </script>
</body>
</html>
